  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b0e;
      --surface: #111318;
      --surface-2: #171a20;
      --line: rgba(255,255,255,0.08);
      --text: #f5f5f7;
      --muted: #9a9ca6;
      --red: #e4202d;
      --red-deep: #8a0f18;
      --silver: #c9cbd3;
      --green: #25d366;
      --gold: #e2c05a;
      --radius: 22px;
      --max: 480px;
      --ease: cubic-bezier(.22,.61,.36,1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }

    /* Fundo */
    .backdrop {
      position: fixed;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(60vw 40vh at 50% -5%, rgba(228,32,45,0.28), transparent 70%),
        radial-gradient(40vw 30vh at 90% 80%, rgba(228,32,45,0.08), transparent 70%),
        var(--bg);
    }
    .backdrop::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 70% 60% at 50% 0%, black 10%, transparent 100%);
    }
    .backdrop::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -20vh;
      width: 90vw;
      max-width: 720px;
      height: 60vh;
      transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(228,32,45,0.22), transparent);
      filter: blur(40px);
      animation: pulse 7s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: .7; transform: translateX(-50%) scale(1); }
      50% { opacity: 1; transform: translateX(-50%) scale(1.08); }
    }

    .wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 16px; }

    /* Cabeçalho */
    .hero {
      position: relative;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      animation: rise .8s var(--ease) both;
    }
    .hero img {
      width: 100%;
      height: auto;
      aspect-ratio: 733 / 468;
      object-fit: cover;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(10,11,14,0) 45%, rgba(10,11,14,0.75) 78%, var(--bg) 100%);
      pointer-events: none;
    }
    .hero::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 4%;
      width: 70%;
      height: 30%;
      transform: translateX(-50%);
      background: radial-gradient(closest-side, rgba(228,32,45,0.35), transparent);
      filter: blur(30px);
      pointer-events: none;
    }
    .profile {
      margin-top: -36px;
      padding: 0 0 8px;
      text-align: center;
      position: relative;
      animation: rise .8s var(--ease) .1s both;
    }
    .verified {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px 6px 8px;
      border-radius: 999px;
      background: rgba(228,32,45,0.14);
      border: 1px solid rgba(228,32,45,0.45);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      backdrop-filter: blur(8px);
      margin-bottom: 12px;
    }
    .verified i {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--red); display: grid; place-items: center;
    }
    .verified svg { width: 10px; height: 10px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .handle {
      margin-top: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .handle b { color: var(--text); font-weight: 700; }
    .tagline {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--red);
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 600;
      color: var(--silver);
      backdrop-filter: blur(8px);
    }
    .chip b { color: #fff; font-weight: 800; }
    .chip svg { width: 14px; height: 14px; fill: currentColor; opacity: .85; }

    .social {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 18px;
    }
    .social a {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--line);
      color: var(--silver);
      transition: transform .2s var(--ease), background .2s, color .2s, border-color .2s;
    }
    .social a:hover { transform: translateY(-2px); background: rgba(228,32,45,0.15); border-color: rgba(228,32,45,0.5); color: #fff; }
    .social svg { width: 18px; height: 18px; fill: currentColor; }

    /* Cards */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 26px 0 32px;
    }
    .tile {
      position: relative;
      display: block;
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: 0 18px 50px rgba(0,0,0,0.5);
      transform: translateZ(0);
      transition: transform .28s var(--ease), box-shadow .28s var(--ease), border-color .28s;
      animation: rise .7s var(--ease) both;
    }
    .tile:nth-child(1) { animation-delay: .08s; }
    .tile:nth-child(2) { animation-delay: .14s; }
    .tile:nth-child(3) { animation-delay: .20s; }
    .tile:nth-child(4) { animation-delay: .26s; }
    .tile:nth-child(5) { animation-delay: .32s; }
    .tile:nth-child(6) { animation-delay: .38s; }
    .tile:hover, .tile:focus-visible {
      transform: translateY(-4px) scale(1.01);
      border-color: rgba(255,255,255,0.18);
      box-shadow: 0 26px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(228,32,45,0.25);
      outline: none;
    }
    .tile img {
      width: 100%;
      height: auto;
      aspect-ratio: 768 / 307;
      object-fit: cover;
      transition: transform .6s var(--ease);
    }
    .tile:hover img { transform: scale(1.03); }
    .tile::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(120deg, rgba(255,255,255,0) 30%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0) 70%);
      transform: translateX(-120%);
      transition: transform .9s var(--ease);
      pointer-events: none;
    }
    .tile:hover::after { transform: translateX(120%); }
    .tile .go {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(10,11,14,0.65);
      border: 1px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(6px);
      display: grid;
      place-items: center;
      opacity: 0;
      transform: translate(6px, -6px);
      transition: opacity .25s, transform .25s var(--ease);
    }
    .tile:hover .go { opacity: 1; transform: translate(0,0); }
    .tile .go svg { width: 14px; height: 14px; stroke: #fff; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .tile .badge {
      position: absolute;
      left: 14px;
      top: 12px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      background: var(--red);
      color: #fff;
      box-shadow: 0 6px 18px rgba(228,32,45,0.45);
    }
    .tile .badge.green { background: var(--green); color: #052b14; box-shadow: 0 6px 18px rgba(37,211,102,0.35); }

    /* Card iBest (sem arte) */
    .tile.ibest {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 150px;
      padding: 26px 26px;
      background:
        radial-gradient(60% 120% at 0% 50%, rgba(226,192,90,0.22), transparent 70%),
        linear-gradient(90deg, #1a160c 0%, #121108 100%);
      border-color: rgba(226,192,90,0.35);
    }
    .tile.ibest .trophy {
      flex: 0 0 auto;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(160deg, rgba(226,192,90,0.25), rgba(226,192,90,0.05));
      border: 1px solid rgba(226,192,90,0.4);
      display: grid;
      place-items: center;
      color: var(--gold);
    }
    .tile.ibest .trophy svg { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .tile.ibest .t { text-align: right; min-width: 0; }
    .tile.ibest .t > span { display: block; }
    .tile.ibest .h { white-space: nowrap; }
    .tile.ibest .k { font-size: 12px; letter-spacing: 0.38em; text-transform: uppercase; color: #fff; font-weight: 500; }
    .tile.ibest .h { font-size: clamp(36px, 11vw, 46px); font-weight: 900; line-height: 1; margin-top: 4px; color: #fff; letter-spacing: -0.02em; }
    .tile.ibest .h .bang {
      display: inline-grid; place-items: center;
      width: 0.82em; height: 0.82em; border-radius: 50%;
      background: #f5c400; color: var(--red); font-size: 0.78em; vertical-align: 0.04em;
    }
    .tile.ibest .s { margin-top: 8px; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: #ecdca4; font-weight: 600; white-space: nowrap; }

    /* Rodapé */
    footer {
      margin-top: auto;
      text-align: center;
      padding: 22px 16px 34px;
      font-size: 12px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      background: rgba(0,0,0,0.5);
    }
    footer .brand { font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--silver); font-size: 11px; margin-bottom: 6px; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
    @media (min-width: 720px) {
      .profile { margin-top: -56px; }
    }
  </style>
</head>

  <script>
    (function () {
      var cfg = window.VENETO_TRACK || {};
      if (!cfg.url || !cfg.key || location.protocol === 'file:') return;
      var sid = null;

      var q = new URLSearchParams(location.search);
      var ua = navigator.userAgent || '';
      var device = /iPad|Tablet/i.test(ua) ? 'tablet' : (/Mobi|Android|iPhone/i.test(ua) ? 'mobile' : 'desktop');
      var base = {
        page: location.pathname,
        session_id: sid,
        referrer: (document.referrer || '').slice(0, 300) || null,
        utm_source: q.get('utm_source'), utm_medium: q.get('utm_medium'),
        utm_campaign: q.get('utm_campaign'), utm_content: q.get('utm_content'),
        device: device,
        lang: (navigator.language || '').slice(0, 16) || null
      };
      function send(ev) {
        var body = JSON.stringify(Object.assign({}, base, ev));
        try {
          fetch(cfg.url.replace(/\/$/, '') + '/rest/v1/bio_events', {
            method: 'POST', keepalive: true, mode: 'cors',
            headers: { 'Content-Type': 'application/json', 'apikey': cfg.key, 'Authorization': 'Bearer ' + cfg.key, 'Prefer': 'return=minimal' },
            body: body
          }).catch(function () {});
        } catch (e) {}
      }
      send({ event: 'view' });
      document.querySelectorAll('[data-track]').forEach(function (el) {
        el.addEventListener('click', function () {
          send({ event: 'click', button: el.getAttribute('data-track'), href: (el.getAttribute('href') || '').slice(0, 300) });
        });
      });
    })();
  </script>
</body>
</html>
